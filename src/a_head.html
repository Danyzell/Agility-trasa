<title>HandlerMap</title>
<script>try{var t0=JSON.parse(localStorage.getItem('agility-theme-v1'));if(t0==='light'||t0==='dark')document.documentElement.setAttribute('data-theme',t0);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4ee; --surface:#ffffff; --sunk:#e9ede4; --field:#e4eddb; --grid:#c9d6bd;
  --text:#17201a; --muted:#5d6a60; --border:#d3dacb;
  --accent:#1f6b45; --on-accent:#ffffff; --zone:#e8a838; --on-zone:#2a1d05;
  --good:#2b8a57; --warn:#b97a06; --bad:#c0392b;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1411; --surface:#182019; --sunk:#131a15; --field:#1b261d; --grid:#2c3a2e;
    --text:#e5ebe2; --muted:#94a293; --border:#2b362d;
    --accent:#5fb487; --on-accent:#0b1a11; --zone:#f0b94d; --on-zone:#2a1d05;
    --good:#58c08a; --warn:#e2a93a; --bad:#ec6a5c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1411; --surface:#182019; --sunk:#131a15; --field:#1b261d; --grid:#2c3a2e;
  --text:#e5ebe2; --muted:#94a293; --border:#2b362d;
  --accent:#5fb487; --on-accent:#0b1a11; --zone:#f0b94d; --on-zone:#2a1d05;
  --good:#58c08a; --warn:#e2a93a; --bad:#ec6a5c;
}
*{box-sizing:border-box;}
html,body{min-height:100%;}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--body); font-size:15px; line-height:1.45;}
button,input,select{font:inherit; color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.num{font-variant-numeric:tabular-nums;}

/* horní lišta */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--border);}
.top-in{max-width:760px; margin:0 auto; padding:8px 16px; display:flex; align-items:center; gap:10px;}
.brand{width:34px; height:34px; flex:0 0 auto; border-radius:9px; background:var(--accent); display:grid; place-items:center;}
.brand svg{width:22px; height:22px;}
.ctitle{flex:1; min-width:0; text-align:left; border:0; background:none; padding:2px 0;}
.ctitle b{display:block; font-family:var(--display); font-size:21px; font-weight:700; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ctitle span{display:block; font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.iconbtn{width:40px; height:40px; flex:0 0 auto; display:grid; place-items:center; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--muted);}
.iconbtn svg{width:21px; height:21px;}
.iconbtn[aria-pressed="true"].fav{color:var(--zone); border-color:var(--zone);}
.iconbtn[aria-pressed="true"].done{color:var(--on-accent); background:var(--accent); border-color:var(--accent);}
.iconbtn:disabled{opacity:.35; cursor:default;}

main{max-width:760px; margin:0 auto; padding:12px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));}
.view{display:flex; flex-direction:column; gap:12px;}
h2{font-family:var(--display); font-size:20px; font-weight:600; margin:4px 0 0; text-wrap:balance;}
.hint{color:var(--muted); font-size:13.5px; margin:0;}

/* údaje o trati */
.specs{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:12px; overflow:hidden;}
.spec{background:var(--surface); padding:8px 10px;}
.spec small{display:block; font-size:11.5px; color:var(--muted); letter-spacing:.02em;}
.spec b{display:block; font-family:var(--display); font-size:22px; font-weight:600; line-height:1.15; font-variant-numeric:tabular-nums;}
.spec i{display:block; font-style:normal; font-size:11px; color:var(--muted);}
.spec.mct b{color:var(--bad);}
@media (max-width:420px){ .specs{grid-template-columns:repeat(2,1fr);} }

.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.grow{flex:1;}
.seg{display:inline-flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface);}
.seg button{border:0; background:none; color:var(--muted); padding:8px 14px; font-size:14px; font-weight:500;}
.seg button.on{background:var(--accent); color:var(--on-accent);}
.btn{border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:8px 13px; font-size:14px; font-weight:500; display:inline-flex; align-items:center; gap:6px;}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
.btn.danger{color:var(--bad);}
.btn:disabled{opacity:.45; cursor:default;}
.btn svg{width:17px; height:17px;}
.zoom{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13px;}
#undoAll{padding:8px 11px;}
@media (max-width:379px){ #zLbl{display:none;} }
select.btn{padding-right:8px;}

.palette{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; scrollbar-width:thin;}
.ob-btn{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 8px; min-width:62px; border-radius:10px; border:2px solid var(--border); background:var(--surface); font-size:11px; color:var(--text);}
.ob-btn svg{width:26px; height:26px;}
.ob-btn.on{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,var(--surface));}
.selrow{display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap; font-size:13.5px; color:var(--muted);}
.selrow input{flex:1 1 110px; min-width:110px; accent-color:var(--accent);}
.selacts{display:flex; gap:8px; margin-left:auto;}

#wrap{overflow:auto; max-height:70vh; border:1px solid var(--border); border-radius:12px; background:var(--field);}
#field{display:block; height:auto; user-select:none; -webkit-user-select:none;}
#field.build .ob{touch-action:none; cursor:grab;}
#field.route .ob{cursor:pointer;}
#pth,#bdg{pointer-events:none;}
.order{margin:0; padding:0 0 0 22px; columns:2; font-size:14px; line-height:1.75;}
.order .empty{list-style:none; margin-left:-22px; color:var(--muted);}

/* knihovna parkurů */
.filters{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
.chip{flex:0 0 auto; border:1px solid var(--border); background:var(--surface); color:var(--muted); border-radius:999px; padding:6px 12px; font-size:13.5px;}
.chip.on{background:var(--text); color:var(--bg); border-color:var(--text);}
.progress{display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--muted);}
.bar{flex:1; height:8px; border-radius:99px; background:var(--sunk); overflow:hidden;}
.bar i{display:block; height:100%; background:var(--accent); border-radius:99px;}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px;}
.card{position:relative; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden;}
.card.cur{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.card .pick{display:block; width:100%; border:0; background:none; padding:0; text-align:left;}
.card .pick svg{display:block; width:100%; height:auto; background:var(--field);}
.card .meta{padding:7px 9px 9px; display:flex; flex-direction:column; gap:1px;}
.card .meta b{font-family:var(--display); font-size:17px; font-weight:600; line-height:1.15;}
.card .meta span{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card .st{position:absolute; top:6px; right:6px; display:flex; gap:4px;}
.card .st button{width:30px; height:30px; border-radius:8px; border:0; background:color-mix(in srgb,var(--surface) 88%,transparent); color:var(--muted); display:grid; place-items:center;}
.card .st button svg{width:17px; height:17px;}
.card .st button.fav.on{color:var(--zone);}
.card .tags{position:absolute; top:6px; left:6px; display:flex; gap:4px; pointer-events:none;}
.card .done-tag{background:var(--accent); color:var(--on-accent); font-size:11.5px; font-weight:600; border-radius:6px; padding:2px 7px;}
.card .new-tag{background:var(--zone); color:var(--on-zone); font-size:11.5px; font-weight:700; border-radius:6px; padding:2px 7px; letter-spacing:.02em;}
.btn[hidden],.chip[hidden],.ndot[hidden]{display:none;}
.catbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--muted);}
.catbar .grow{min-width:0; flex:1 1 180px;}
.catbar .btn{flex:0 0 auto;}
.btn.busy svg{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.seg button{position:relative;}
.seg button .tdot{position:absolute; top:4px; right:5px; width:8px; height:8px; border-radius:50%; background:var(--zone);}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
.chip.chip-new{border-color:var(--zone); color:var(--text);}
.chip.chip-new.on{background:var(--zone); color:var(--on-zone); border-color:var(--zone);}
.nav button{position:relative;}
.nav .ndot{position:absolute; top:8px; left:calc(50% + 8px); width:9px; height:9px; border-radius:50%; background:var(--zone); box-shadow:0 0 0 2px var(--surface);}
.order .chk{display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; background:var(--bad); color:#fff; font-size:12px; font-weight:700; margin-left:4px; vertical-align:1px;}
.impaste{border:1.5px dashed var(--border); border-radius:10px; padding:14px; text-align:center; color:var(--muted); font-size:13.5px; min-height:48px; outline:none;}
.impaste:focus{border-color:var(--accent); color:var(--text);}
.newlist{display:flex; flex-direction:column; gap:6px; margin:6px 0 4px;}
.newitem{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:9px 11px; color:var(--text);}
.newitem b{font-size:15px;}
.newitem span{font-size:12.5px; color:var(--muted);}
.empty-state{grid-column:1/-1; background:var(--surface); border:1px dashed var(--border); border-radius:12px; padding:18px; color:var(--muted); font-size:14px;}

/* běh a stopky */
.panel{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px;}
.clock{font-family:var(--display); font-weight:700; font-size:clamp(64px,22vw,112px); line-height:1; text-align:center; font-variant-numeric:tabular-nums; letter-spacing:.01em; margin:4px 0 2px; transition:color .2s;}
.clock.over{color:var(--warn);} .clock.dis{color:var(--bad);}
.clock-sub{display:flex; justify-content:center; gap:14px; font-size:13px; color:var(--muted);}
.clock-sub b{color:var(--text); font-weight:600;}
.startbtn{width:100%; margin-top:12px; padding:16px; border-radius:14px; border:0; background:var(--accent); color:var(--on-accent); font-family:var(--display); font-size:26px; font-weight:700; letter-spacing:.03em;}
.startbtn.stop{background:var(--bad); color:#fff;}
.counters{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.counter{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px; display:flex; align-items:center; justify-content:space-between; gap:6px;}
.counter div small{display:block; font-size:12px; color:var(--muted);}
.counter div b{font-family:var(--display); font-size:30px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums;}
.counter .pm{display:flex; gap:6px;}
.counter .pm button{width:42px; height:42px; border-radius:10px; border:1px solid var(--border); background:var(--sunk); font-size:22px; font-weight:600; line-height:1;}
.field-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px;}
.field-row input[type=number],.field-row input[type=text]{width:110px; padding:8px 10px; border:1px solid var(--border); border-radius:10px; background:var(--surface);}
.check{display:inline-flex; align-items:center; gap:7px; font-size:14px;}
.check input{width:18px; height:18px; accent-color:var(--bad);}
.result{display:flex; align-items:center; gap:14px;}
.grade{flex:0 0 auto; min-width:78px; text-align:center; font-family:var(--display); font-size:30px; font-weight:700; border-radius:12px; padding:6px 10px; color:#fff; background:var(--muted);}
.grade.V{background:var(--good);} .grade.VD{background:#3f7fc1;} .grade.D{background:var(--warn);} .grade.BO,.grade.DIS{background:var(--bad);}
.result p{margin:0; font-size:14px;}
.result p b{font-variant-numeric:tabular-nums;}
.hist{margin:0; padding:0; list-style:none; display:flex; flex-direction:column;}
.hist li{display:grid; grid-template-columns:auto 1fr auto auto; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--border); font-size:14px;}
.hist li:first-child{border-top:0;}
.hist .g{font-family:var(--display); font-weight:700; font-size:16px; border-radius:7px; padding:1px 7px; color:#fff; background:var(--muted);}
.hist .g.V{background:var(--good);} .hist .g.VD{background:#3f7fc1;} .hist .g.D{background:var(--warn);} .hist .g.BO,.hist .g.DIS{background:var(--bad);}
.hist small{color:var(--muted);}
.hist button{border:0; background:none; color:var(--muted); font-size:18px; padding:2px 6px;}
.speed{display:flex; align-items:center; gap:8px; font-size:14px;}
.speed span small{display:block; font-size:12px; color:var(--muted);}
.speed b{white-space:nowrap; min-width:64px; text-align:center;}
.speed button{width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--sunk); font-size:18px;}

/* trenéři */
.coach-list{display:flex; flex-direction:column; gap:8px;}
.coach{display:grid; grid-template-columns:44px 1fr auto; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px; color:inherit; text-decoration:none;}
.coach .cc{width:44px; height:44px; border-radius:10px; background:var(--sunk); display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:16px; color:var(--muted);}
.coach b{display:block; font-size:15px;}
.coach span{display:block; font-size:13px; color:var(--muted);}
.coach svg{width:18px; height:18px; color:var(--muted);}

/* spodní navigace */
.nav{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom,0px);}
.nav-in{max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr); height:var(--nav-h);}
.nav button{border:0; background:none; color:var(--muted); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:12px; font-weight:500;}
.nav button svg{width:24px; height:24px;}
.nav button.on{color:var(--accent);}
.nav button.on span{font-weight:600;}

/* dialog */
.scrim{position:fixed; inset:0; z-index:80; background:rgba(8,12,9,.5); display:flex; align-items:flex-end; justify-content:center; padding:16px;}
.sheet{width:100%; max-width:460px; background:var(--surface); border-radius:16px; padding:18px 16px 16px; display:flex; flex-direction:column; gap:12px; box-shadow:0 12px 40px rgba(0,0,0,.25); margin-bottom:env(safe-area-inset-bottom,0px);}
@media (min-width:600px){ .scrim{align-items:center;} }
.sheet h3{margin:0; font-family:var(--display); font-size:22px; font-weight:600;}
.sheet p{margin:0; color:var(--muted); font-size:14px;}
.sheet label{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted);}
.sheet input,.sheet select{padding:10px 11px; border:1px solid var(--border); border-radius:10px; background:var(--bg); font-size:15px; color:var(--text);}
.sheet .acts{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px)); z-index:90; background:var(--text); color:var(--bg); padding:9px 14px; border-radius:10px; font-size:14px; box-shadow:0 6px 20px rgba(0,0,0,.2);}

/* v1.3: nástroje plánu */
.tools{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:thin;}
.tool{flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:7px 11px; font-size:13.5px; font-weight:500; color:var(--text);}
.tool svg{width:17px; height:17px; color:var(--accent);}
.tool.on{background:var(--accent); color:var(--on-accent); border-color:var(--accent);}
.tool.on svg{color:var(--on-accent);}
.modebar{background:var(--surface); border:1px solid var(--accent); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:8px;}
.modebar .row{align-items:center;}
.seg.wide{display:flex; width:100%;}
.seg.wide button{flex:1; padding:8px 4px;}
.order li .sd{margin-left:8px; display:inline-flex; gap:4px; vertical-align:middle;}
.order li .sd button{min-width:30px; height:26px; border-radius:7px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; font-weight:600; color:var(--muted);}
.order li .sd button.on{background:var(--accent); color:var(--on-accent); border-color:var(--accent);}
.order.sidemode{columns:1;}

/* 3D */
.ov3d{position:fixed; inset:0; z-index:70; background:#0d1410; display:flex; flex-direction:column;}
.ov3d canvas{flex:1; width:100%; min-height:0; display:block; touch-action:none;}
.ov3d-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); background:#18201a; color:#e5ebe2; font-size:13px;}
.ov3d-bar .btn{background:#233026; color:#e5ebe2; border-color:#35443a;}
.ov3d-bar .btn.primary{background:#5fb487; color:#0b1a11; border-color:#5fb487;}
.ov3d-bar .seg{background:#233026; border-color:#35443a;}
.ov3d-bar .seg button{color:#c6d3c4;}
.ov3d-bar .seg button.on{background:#5fb487; color:#0b1a11;}

/* videa */
.topics{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.topic{display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; color:var(--text);}
.topic svg{width:44px; height:30px;}
.topic b{font-family:var(--display); font-size:18px; font-weight:600; line-height:1.1;}
.topic span{font-size:12.5px; color:var(--muted);}
.stage{background:var(--field); border:1px solid var(--border); border-radius:12px; overflow:hidden;}
.stage svg{display:block; width:100%; height:auto;}
.stage{position:relative;}
.stage canvas{display:block; width:100%; height:auto; aspect-ratio:2/1; touch-action:pan-y;}
.topic{position:relative;}
.topic .b3d{position:absolute; top:10px; right:10px; font-size:10.5px; font-weight:700; letter-spacing:.5px; color:var(--accent); border:1px solid var(--accent); border-radius:6px; padding:1px 5px; line-height:1.3;}
.caption{min-height:44px; font-size:15px; font-weight:500; padding:8px 2px 0;}
.steps{margin:0; padding-left:22px; display:flex; flex-direction:column; gap:6px; font-size:14.5px;}
.tips{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px; font-size:14px; color:var(--text);}
.vlinks{display:flex; flex-direction:column; gap:8px;}
.vlink{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px; color:inherit; text-decoration:none;}
.vlink b{display:block; font-size:14.5px; font-weight:600;}
.vlink span{display:block; font-size:12.5px; color:var(--muted);}
.lang{font-size:11.5px; font-weight:700; border-radius:6px; padding:3px 6px; background:var(--sunk); color:var(--muted);}
.lang.cz{background:var(--accent); color:var(--on-accent);}
.vlink svg{width:18px; height:18px; color:var(--muted);}
.backlink{align-self:flex-start;}

/* více: formuláře, psi, statistiky, deník */
.list{display:flex; flex-direction:column; gap:8px;}
.item{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
.item.cur{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.item b{font-size:15px;}
.item span{display:block; font-size:13px; color:var(--muted);}
.item .acts{display:flex; gap:6px;}
.tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:12px; overflow:hidden;}
.tiles>div{background:var(--surface); padding:10px 12px;}
