name: Testy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright a Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 jsqr@1.4.0
          npx playwright install --with-deps chromium
      - name: Testy v prohlížeči
        run: node tests/run.js

  nasazeni:
    needs: testy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOK: ${{ secrets.PAWKUR_WEB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Nasadit na pawkur.cz (repozitář Danyzell/pawkur-web)
        if: env.TOK != ''
        run: |
          set -e
          # špatný token dřív končil zeleně a s „beze změn“; teď je chyba vidět. pawkur-web je veřejný, klon projde i bez tokenu,
          # token se použije až při pushi
          git clone --depth 1 "https://x-access-token:${TOK}@github.com/Danyzell/pawkur-web.git" /tmp/web || { echo "::error::Klon Danyzell/pawkur-web selhal."; exit 1; }
          (cd /tmp/web && git rm -rq --ignore-unmatch . >/dev/null 2>&1 || true)
          cp index.html sw.js manifest.webmanifest privacy.html terms.html og.jpg hero.webp icon-192.png icon-512.png icon-maskable-512.png /tmp/web/
          mkdir -p /tmp/web/v3d && cp v3d/v3d.js /tmp/web/v3d/
          mkdir -p /tmp/web/i18n && cp i18n/pl.js i18n/de.js /tmp/web/i18n/
          cp -r web /tmp/web/web
          printf 'pawkur.cz\n' > /tmp/web/CNAME
          touch /tmp/web/.nojekyll
          printf '# pawkur.cz\n\nNasazeno automaticky z Danyzell/Agility-trasa (%s). Neupravovat ručně, změny patří do repozitáře aplikace.\n' "$GITHUB_SHA" > /tmp/web/README.md
          cd /tmp/web && git add -A
          if git diff --cached --quiet; then echo "beze změn"; exit 0; fi
          git -c user.name=pawkur-bot -c user.email=noreply@pawkur.cz commit -qm "Nasazení $GITHUB_SHA"
          git push || { echo "::error::Push do Danyzell/pawkur-web selhal: PAWKUR_WEB_TOKEN je neplatný (překlep, vypršel, smazaný), nebo nemá Contents: Read and write pro pawkur-web. Vytvoř nový token a ulož ho znovu do Settings → Secrets and variables → Actions."; exit 1; }
