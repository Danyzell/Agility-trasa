name: Testy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright a Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 jsqr@1.4.0
          npx playwright install --with-deps chromium
      - name: Testy v prohlížeči
        run: node tests/run.js
